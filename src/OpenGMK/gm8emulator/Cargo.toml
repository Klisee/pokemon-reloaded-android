[package]
name = "gm8emulator"
version = "0.2.0"
authors = ["The OpenGMK Project Developers"]
license = "GPL-2.0-only"
edition = "2021"
rust-version = "1.77"
default-run = "gm8emulator"

[lib]
name = "gm8emulator"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
gl_generator = "0.14"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
bincode = "1.3.3"
flate2 = "1.0"
byteorder = "1.5"
clipboard = "0.5"
encoding_rs = "0.8"
getopts = "0.2"
getrandom = "0.2"  # 0.3.4
glob = "0.3"
gm8exe = { path = "../gm8exe" }
reloaded-online-net = { package = "reloaded-online", path = "../online" }
gml-parser = { path = "../gml-parser", features = ["runner-serde-derives"] }
hex = "0.4"
image = { version = "0.25.6", features = ["bmp", "gif", "ico", "jpeg", "png", "tga", "tiff"], default-features = false }
imgui = { version = "0.12", features = ["tables-api"] }
indexmap = { version = "2.5.0", features = ["serde"] }  # 2.11.4
lzzzz = "2.0"
rustysynth = "=1.3.6"
phf = { version = "0.13", features = ["macros"] }
ramen = { path = "../../../vendor/ramen", features = ["input", "parking-lot"] }
rect_packer = "0.2"
rmp3 = { version = "0.3", features = ["float"] }
rust-ini = "0.21"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_with = { version = "3.16.1", features = ["alloc", "macros"], default-features = false }
time = { version = "0.3.41", features = ["local-offset", "macros"] }


[target.'cfg(all(target_os = "windows"))'.dependencies]
crc32fast = "1.5"
libffi = "3.1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies.udon]
path = "../../../vendor/udon"
features = ["serde-derives", "wav"]

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "=0.6.1", features = ["native-activity"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# For the immersive (nav-bar-hiding) JNI call: `ndk-context` gives us the Activity + JavaVM that
# android-activity initialised, and `jni` 0.21 has the simplest raw call API.
ndk-context = "0.1"
jni = "0.21"
