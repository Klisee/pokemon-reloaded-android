name: Build APKs

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NDK_VERSION: 27.2.12479018
  CARGO_NDK_VERSION: 3.5.4
  RUST_VERSION: 1.99.0

jobs:
  build:
    name: ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust: aarch64-linux-android
          - abi: armeabi-v7a
            rust: armv7-linux-androideabi
          - abi: x86_64
            rust: x86_64-linux-android

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust target and cargo-ndk
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "${{ matrix.rust }}"
          cargo +"$RUST_VERSION" install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - name: Build native engine
        working-directory: src/OpenGMK
        run: cargo +"$RUST_VERSION" ndk -t "${{ matrix.abi }}" --platform 29 build -p gm8emulator --release

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease -PtargetAbi=${{ matrix.abi }}

      - name: Verify architecture
        shell: bash
        run: |
          SO="src/OpenGMK/target/${{ matrix.rust }}/release/libgm8emulator.so"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$SO"
          test -s "$APK"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$SO"
          unzip -l "$APK" | grep "lib/${{ matrix.abi }}/libgm8emulator.so"

      - name: Upload APK and native library
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-reloaded-${{ matrix.abi }}
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            src/OpenGMK/target/${{ matrix.rust }}/release/libgm8emulator.so
