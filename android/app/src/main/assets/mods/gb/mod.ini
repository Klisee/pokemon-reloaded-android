name=Game Boy
enabled=1
effect=gb
author=Klisee
description=Este mod permite jugar con el aspecto y el sonido de una Game Boy, con colores limitados y audio de 8 bits.

# Filtro de cuatro tonos, tipo Game Boy / sepia.
strength=1.0
dither=0.25
contrast=0.90
brightness=1.02

# Audio lo-fi tipo Game Boy (bitcrush + sample-and-hold).
audio=gb
audio_bits=6
audio_rate=8000
audio_mono=1
